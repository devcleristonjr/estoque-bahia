<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cadastro e Atualização de Estoque{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      :root {
        --public-bg: #f5f7fb;
        --public-ink: #1f2937;
        --public-accent: #155eef;
        --public-success: #138a36;
        --public-warning: #b7791f;
        --public-surface: rgba(255, 255, 255, 0.92);
      }

      body.public-body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(21, 94, 239, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(19, 138, 54, 0.10), transparent 26%),
          linear-gradient(180deg, #fbfcff 0%, var(--public-bg) 100%);
        color: var(--public-ink);
      }

      .public-shell {
        max-width: 920px;
      }

      .public-hero {
        background: linear-gradient(135deg, rgba(21, 94, 239, 0.08), rgba(19, 138, 54, 0.07));
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      .public-card {
        background: var(--public-surface);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 22px;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(8px);
      }

      .option-card {
        border-radius: 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .option-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
      }

      .soft-label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .material-row {
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 18px;
        padding: 1rem;
        background: #fff;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
        margin-right: 0.5rem;
      }

      @media (max-width: 576px) {
        .public-hero,
        .public-card,
        .option-card {
          border-radius: 18px;
        }

        .btn-lg {
          padding-top: 0.95rem;
          padding-bottom: 0.95rem;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="public-body">
    <main class="container py-3 py-md-4 public-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} shadow-sm" role="alert">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        document.querySelectorAll("[data-select-filter]").forEach(function (input) {
          const targetId = input.getAttribute("data-select-filter");
          const select = document.getElementById(targetId);
          if (!select) return;

          input.addEventListener("input", function () {
            const query = input.value.trim().toLowerCase();
            Array.from(select.options).forEach(function (option, index) {
              if (index === 0) return;
              const label = option.textContent.toLowerCase();
              option.hidden = Boolean(query) && !label.includes(query);
            });
          });
        });

        const btn = document.getElementById("btn-localizacao");
        if (btn) {
          const statusEl = document.getElementById("status-localizacao");
          const latInput = document.querySelector('input[name="latitude"]');
          const lonInput = document.querySelector('input[name="longitude"]');
          btn.addEventListener("click", function () {
            if (!navigator.geolocation) {
              if (statusEl) {
                statusEl.className = "text-warning small fw-semibold mt-2";
                statusEl.textContent = "Geolocalização não suportada neste navegador.";
              }
              return;
            }

            if (statusEl) {
              statusEl.className = "text-warning small fw-semibold mt-2";
              statusEl.textContent = "Obtendo localização...";
            }

            navigator.geolocation.getCurrentPosition(
              function (position) {
                if (latInput) latInput.value = position.coords.latitude.toFixed(6);
                if (lonInput) lonInput.value = position.coords.longitude.toFixed(6);
                if (statusEl) {
                  statusEl.className = "text-success small fw-semibold mt-2";
                  statusEl.textContent = "✅ Localização registrada";
                }
              },
              function () {
                if (statusEl) {
                  statusEl.className = "text-muted small fw-semibold mt-2";
                  statusEl.textContent = "Localização não informada";
                }
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          });
        }

        const copyButtons = document.querySelectorAll("[data-copy-link]");
        copyButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            const targetId = button.getAttribute("data-copy-link");
            const input = document.getElementById(targetId);
            if (!input) return;
            try {
              await navigator.clipboard.writeText(input.value);
              const original = button.textContent;
              button.textContent = "Link copiado!";
              setTimeout(function () {
                button.textContent = original;
              }, 1400);
            } catch (_error) {
              input.select();
              document.execCommand("copy");
              const original = button.textContent;
              button.textContent = "Link copiado!";
              setTimeout(function () {
                button.textContent = original;
              }, 1400);
            }
          });
        });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
