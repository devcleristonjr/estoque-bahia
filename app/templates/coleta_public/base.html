<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cadastro e Atualização de Estoque{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
  </head>
  <body class="public-body">
    <main class="container py-3 py-md-4 public-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-3">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-soft" role="alert">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        document.querySelectorAll("[data-select-filter]").forEach(function (input) {
          const targetId = input.getAttribute("data-select-filter");
          const select = document.getElementById(targetId);
          if (!select) return;

          input.addEventListener("input", function () {
            const query = input.value.trim().toLowerCase();
            Array.from(select.options).forEach(function (option, index) {
              if (index === 0) return;
              const label = option.textContent.toLowerCase();
              option.hidden = Boolean(query) && !label.includes(query);
            });
          });
        });

        const btn = document.getElementById("btn-localizacao");
        if (btn) {
          const statusEl = document.getElementById("status-localizacao");
          const latInput = document.querySelector('input[name="latitude"]');
          const lonInput = document.querySelector('input[name="longitude"]');
          btn.addEventListener("click", function () {
            if (!navigator.geolocation) {
              if (statusEl) {
                statusEl.className = "text-warning small fw-semibold mt-2";
                statusEl.textContent = "Geolocalização não suportada neste navegador. Você pode continuar sem informar localização atual.";
              }
              return;
            }

            if (statusEl) {
              statusEl.className = "text-warning small fw-semibold mt-2";
              statusEl.textContent = "Obtendo sua localização atual...";
            }

            navigator.geolocation.getCurrentPosition(
              function (position) {
                if (latInput) latInput.value = position.coords.latitude.toFixed(6);
                if (lonInput) lonInput.value = position.coords.longitude.toFixed(6);
                if (statusEl) {
                  statusEl.className = "text-success small fw-semibold mt-2";
                  statusEl.textContent = "✅ Localização atual registrada no mapa";
                }
              },
              function () {
                if (statusEl) {
                  statusEl.className = "text-muted small fw-semibold mt-2";
                  statusEl.textContent = "Localização atual não informada (opcional)";
                }
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          });
        }

        const copyButtons = document.querySelectorAll("[data-copy-link]");
        copyButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            const targetId = button.getAttribute("data-copy-link");
            const input = document.getElementById(targetId);
            if (!input) return;
            try {
              await navigator.clipboard.writeText(input.value);
              const original = button.textContent;
              button.textContent = "Link copiado!";
              setTimeout(function () {
                button.textContent = original;
              }, 1400);
            } catch (_error) {
              input.select();
              document.execCommand("copy");
              const original = button.textContent;
              button.textContent = "Link copiado!";
              setTimeout(function () {
                button.textContent = original;
              }, 1400);
            }
          });
        });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
